<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>RetroAchievements OBS Overlay</title>
  <link rel="stylesheet" href="styles.css?v=101">
</head>
<body>
  <main class="overlay" aria-label="RetroAchievements game and achievement tracker">
    <header class="game-header">
      <img id="game-icon" class="game-icon" alt="" width="96" height="96" hidden>
      <div class="game-info">
        <div id="game-title" class="game-title">Waiting for RetroAchievements</div>
        <div class="game-meta">
          <div id="console" class="console">Configure your account in Tracker Settings</div>
          <div id="progress" class="progress">— / —</div>
        </div>
      </div>
    </header>

    <section class="unlocks" aria-label="Achievement list">
      <h2 id="unlocks-heading" class="unlocks-heading">Latest Achievements Unlocked</h2>
      <div id="achievement-list" class="achievement-list">
        <article class="achievement-card" id="achievement-1" hidden>
          <img class="badge" alt="" width="64" height="64">
          <div class="achievement-copy">
            <div class="achievement-title-row">
              <div class="achievement-title"></div>
              <div class="achievement-points"></div>
            </div>
            <div class="achievement-description-clip"><div class="achievement-description"></div></div>
          </div>
        </article>
        <article class="achievement-card" id="achievement-2" hidden>
          <img class="badge" alt="" width="64" height="64">
          <div class="achievement-copy">
            <div class="achievement-title-row">
              <div class="achievement-title"></div>
              <div class="achievement-points"></div>
            </div>
            <div class="achievement-description-clip"><div class="achievement-description"></div></div>
          </div>
        </article>
        <article class="achievement-card" id="achievement-3" hidden>
          <img class="badge" alt="" width="64" height="64">
          <div class="achievement-copy">
            <div class="achievement-title-row">
              <div class="achievement-title"></div>
              <div class="achievement-points"></div>
            </div>
            <div class="achievement-description-clip"><div class="achievement-description"></div></div>
          </div>
        </article>
        <article class="achievement-card" id="achievement-4" hidden>
          <img class="badge" alt="" width="64" height="64">
          <div class="achievement-copy">
            <div class="achievement-title-row">
              <div class="achievement-title"></div>
              <div class="achievement-points"></div>
            </div>
            <div class="achievement-description-clip"><div class="achievement-description"></div></div>
          </div>
        </article>
        <article class="achievement-card" id="achievement-5" hidden>
          <img class="badge" alt="" width="64" height="64">
          <div class="achievement-copy">
            <div class="achievement-title-row">
              <div class="achievement-title"></div>
              <div class="achievement-points"></div>
            </div>
            <div class="achievement-description-clip"><div class="achievement-description"></div></div>
          </div>
        </article>
      </div>
      <div id="empty-state" class="empty-state" hidden></div>
    </section>
  </main>
  <script src="app.js?v=101"></script>
</body>
</html>
